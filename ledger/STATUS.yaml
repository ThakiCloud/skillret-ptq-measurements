# 원장 항목의 신뢰 상태. 삭제 대신 상태를 붙인다 — 실패와 옛 판본을 지우면
# 이 논문이 주장하는 정직성이 저장소에서 증명되지 않는다.
#
#   canonical    : 현재 인용 가능
#   superseded   : 그 뒤에 더 나은 측정이 나왔다 — 인용 금지, 기록으로만
#   retracted    : 측정 자체가 결함이었다 (RETRACTIONS.md)
#   exploratory  : 탐색용, 인용 대상이 아니었다
#
# 로더(paper/paper_numbers.py)는 canonical 이 아닌 항목을 표에 싣지 않는다.

defaults:
  status: canonical

entries:
  # ── 교사 기준값의 옛 판본 ─────────────────────────────────────────────
  # 80.82 / 605 MB 는 (a) 질의 접두어 계약이 고쳐지기 전 점수이고
  # (b) 605 MB 는 실제 파일이 아니다 — 배포된 BF16 파일은 1,191,586,416 바이트다.
  # 왜 605 였는지는 미확인이다. 추측을 적지 않는다.
  "2026-09-09-param-budget-0.6b.json":      {status: superseded, reason: old-teacher-reference}
  "2026-09-09-pareto.md":                   {status: superseded, reason: old-teacher-reference}
  "2026-09-11-MASTER-LEDGER.json":          {status: superseded, reason: old-teacher-reference}
  "control/2026-09-10-frontier.json":       {status: superseded, reason: old-teacher-reference}
  "control/2026-09-11-frontier-final.json": {status: superseded, reason: old-teacher-reference}
  "control/2026-09-11-frontier-fixed.json": {status: superseded, reason: old-teacher-reference}
  "control/2026-09-11-paper-protocol-and-offset.json": {status: superseded, reason: old-teacher-reference}
  "control/2026-09-11-teacher-capacity-gap.json":      {status: superseded, reason: old-teacher-reference}
  "control/2026-09-11-wave2.json":          {status: superseded, reason: old-teacher-reference}
  "control/2026-09-11-wave3.json":          {status: superseded, reason: old-teacher-reference}
  "lut-diagnosis/2026-09-10-prescription-verdict.json":   {status: exploratory}
  "lut-diagnosis/2026-09-10-public-static-beats-ours.json": {status: exploratory}
  "lut-diagnosis/2026-09-10-why-lut-collapses.json":      {status: exploratory}

  # ── 프롬프트 계약 위반 행 (2026-09-14 감사 (ii)) ────────────────────────────
  # 평가기가 프롬프트를 질의에만 적용했다. E5-base-v2 는 ST 프롬프트 설정이 없어 query:/passage:
  # 없이, EmbeddingGemma 는 문서 접두어(title: none | text: ) 없이 측정됐다. 계약대로 다시 잰
  # sweep-promptfix/ 가 정본이다(잡 srpromptfix, h200, 2026-09-14). Qwen·fine-tune·BGE-M3 는 무영향.
  "sweep/e5-scifact.json":        {status: superseded, reason: prompt-contract}
  "sweep/e5-nfcorpus.json":       {status: superseded, reason: prompt-contract}
  "sweep/e5-skillret.json":       {status: superseded, reason: prompt-contract}
  "sweep/gemma-beir-scifact.json":  {status: superseded, reason: prompt-contract}
  "sweep/gemma-beir-nfcorpus.json": {status: superseded, reason: prompt-contract}
  "sweep/gemma-skillret.json":      {status: superseded, reason: prompt-contract}
  # attn-*/turn-* 의 e5·gemma 판도 같은 결함 — attn 은 본 파일에 병합돼 로더가 읽지 않고,
  # turn-(top-10 교체율)·rank-gemma-*(뒤집힘 곡선)은 재측정이 없다: 논문 §audit 이 공개한다.
  "sweep/2026-09-12-int2-module-isolation.json": {status: superseded, reason: prompt-contract-partial}
  "control/2026-09-11-recon-vs-rank-4models.json": {status: superseded, reason: prompt-contract-partial}
  "control/2026-09-11-paired-ci-int4.json":        {status: superseded, reason: prompt-contract-partial}

reasons:
  old-teacher-reference:
    text: >-
      Teacher reference 80.82 NDCG@10 and 605 MB predate the canonical query-prefix
      contract and the byte-verified artifact measurement.
    superseded_by:
      ndcg_at_10: 78.48
      size_mb: 1191.6
      size_bytes: 1191586416
      evidence: artifacts.csv
  predicted-not-measured:
    text: >-
      Sizes were the arithmetic prediction of size_mb(), not the byte count of a packed
      file. Re-packed 2026-09-13; measured bytes are in artifacts.csv and in the
      sizes_bytes_measured field of the student ledger.
  prompt-contract:
    text: >-
      Evaluated with the prompt applied to queries only; E5-base-v2 had no query:/passage:
      prefixes and EmbeddingGemma no document prefix. Re-measured under the model's own
      prompt contract in sweep-promptfix/ (job srpromptfix, H200, 2026-09-14).
    superseded_by: sweep-promptfix/
  prompt-contract-partial:
    text: >-
      Aggregate ledger whose E5-base-v2 and EmbeddingGemma cells came from the pre-fix rows.
      Rebuilt by scripts/promote_promptfix.py; the other three checkpoints are unchanged.
    superseded_by: 2026-09-14 rebuilds (sweep/2026-09-14-int2-module-isolation.json,
      control/2026-09-14-recon-vs-rank-4models-promptfix.json, control/2026-09-14-paired-ci-int4.json)
